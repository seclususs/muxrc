####################
# Tmux configuration
####################

set -g prefix C-b
set -g prefix2 C-a
bind C-a send-prefix -2

set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 10
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000

set -g mouse on
setw -g mode-keys vi

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded."

############
# Status bar
############
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#181825,fg=#cdd6f4"

set -g status-left-length 30
set -g status-left "#[fg=#89b4fa,bold] [#S] #[default]"

set -g status-right-length 50
set -g status-right "#[fg=#a6adc8]%H:%M #[fg=#6c7086]| #[fg=#a6e3a1,bold]#(whoami) #[default]"

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6c7086,bg=#181825] #I:#W "
setw -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I:#W #[default]"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
